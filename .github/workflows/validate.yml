name: Validate Website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint redesigned homepage files
        run: >-
          npx eslint
          src/app/page.tsx src/app/about/page.tsx src/app/contact/page.tsx
          src/app/layout.tsx src/app/robots.ts src/app/sitemap.ts
          src/app/payment/status/page.tsx
          src/app/api/contact/route.ts
          src/app/api/payment/create-order/route.ts
          src/app/api/payment/verify/route.ts
          src/components/home src/components/LeadForm.tsx
          src/components/CinematicStory.tsx src/components/HomeSections.tsx
          src/components/ProgramShowcase.tsx src/components/SpecialtyShowcase.tsx src/components/Parallax.tsx
          src/components/Navbar.tsx src/components/Footer.tsx src/components/FooterHologram.tsx src/lib/membership.ts
          src/components/admin src/app/admin src/app/api/admin/media
          src/lib/cloudinary-media.ts src/lib/media-auth.ts src/lib/media-slots.ts
      - name: Production build
        run: npm run build
      - name: Repository-wide lint baseline (nonblocking)
        continue-on-error: true
        run: npm run lint
